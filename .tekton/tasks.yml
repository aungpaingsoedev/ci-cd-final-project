apiVersion: tekton.dev/v1beta1
kind: Task
metadata:
  name: cleanup
spec:
  description: Clean the pipeline source workspace before cloning.
  workspaces:
    - name: source
  steps:
    - name: remove
      image: alpine:3
      env:
        - name: WORKSPACE_SOURCE_PATH
          value: $(workspaces.source.path)
      workingDir: $(workspaces.source.path)
      securityContext:
        runAsNonRoot: false
        runAsUser: 0
      script: |
        #!/usr/bin/env sh
        set -eu
        case "${WORKSPACE_SOURCE_PATH}" in
          ""|"/") echo "Refusing to clean an unsafe path" >&2; exit 1 ;;
        esac
        if [ -d "${WORKSPACE_SOURCE_PATH}" ]; then
          rm -rf "${WORKSPACE_SOURCE_PATH:?}"/*
          rm -rf "${WORKSPACE_SOURCE_PATH}"/.[!.]*
          rm -rf "${WORKSPACE_SOURCE_PATH}"/..?*
        fi
---
apiVersion: tekton.dev/v1beta1
kind: Task
metadata:
  name: eslint
spec:
  workspaces:
    - name: source
  params:
    - name: args
      description: Arguments to pass to ESLint
      type: string
      default: 'src/ tests/ --ext .js'
  steps:
    - name: lint
      image: node:20-alpine
      workingDir: $(workspaces.source.path)
      env:
        - name: ESLINT_ARGS
          value: $(params.args)
        - name: npm_config_cache
          value: /tmp/npm-cache
      script: |
        #!/bin/sh
        set -eu
        mkdir -p /tmp/counter-service
        cp package.json package-lock.json .eslintrc.js /tmp/counter-service/
        cp -R src tests /tmp/counter-service/
        cd /tmp/counter-service
        npm ci --no-audit --no-fund
        npm run lint -- $ESLINT_ARGS
---
apiVersion: tekton.dev/v1beta1
kind: Task
metadata:
  name: jest-test
spec:
  workspaces:
    - name: source
  params:
    - name: args
      description: Arguments to pass to jest
      type: string
      default: '--ci --runInBand --verbose'
  steps:
    - name: jest
      image: node:20-alpine
      workingDir: $(workspaces.source.path)
      env:
        - name: JEST_ARGS
          value: $(params.args)
        - name: npm_config_cache
          value: /tmp/npm-cache
      script: |
        #!/bin/sh
        set -eu
        mkdir -p /tmp/counter-service
        cp package.json package-lock.json .eslintrc.js /tmp/counter-service/
        cp -R src tests /tmp/counter-service/
        cd /tmp/counter-service
        npm ci --no-audit --no-fund
        npm test -- $JEST_ARGS
